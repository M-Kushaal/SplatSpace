[project]
name = "gs-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi", "uvicorn[standard]", "sqlalchemy>=2", "pydantic-settings", "email-validator",
    "pyjwt", "argon2-cffi", "boto3",
    "gs-pipeline",  # ../worker — install with: pip install -e ../worker
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "moto[s3]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
