# Custom Gradle properties (Unity uses this file when present).
# Unity's default asks the Gradle daemon for a 4 GB heap; on an 8 GB dev PC that gets the daemon killed
# ("Gradle build daemon disappeared unexpectedly"). 1.5 GB is ample for this app.
org.gradle.jvmargs=-Xmx1536M -Dfile.encoding=UTF-8
org.gradle.parallel=false
unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
